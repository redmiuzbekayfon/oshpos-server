<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OshPOS — Корзина Заказа</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --accent-black: #0f172a;
      --accent-green: #10b981;
      --radius-lg: 16px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-hover: 0 12px 24px -6px rgba(15, 23, 42, 0.08);
      --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    aside {
      width: 260px;
      background-color: var(--accent-black);
      color: #ffffff;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent-green);
    }

    .nav-links {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      transition: var(--transition-smooth);
    }

    .nav-item.active, .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .nav-item:active { transform: scale(0.97); }

    main {
      flex: 1;
      padding: 40px 48px;
      overflow-y: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-title h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-title p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .cart-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-sm);
      max-width: 800px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .cart-item:last-child { border-bottom: none; }

    .item-title { font-weight: 600; font-size: 15px; }
    .item-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .item-price { font-weight: 700; font-size: 15px; }

    .total-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-label { font-size: 16px; font-weight: 600; }
    .total-amount { font-size: 24px; font-weight: 700; color: var(--accent-black); }

    .btn-checkout {
      width: 100%;
      margin-top: 28px;
      background: var(--accent-black);
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-smooth);
      box-shadow: var(--shadow-sm);
    }

    .btn-checkout:hover {
      background: #1e293b;
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .btn-checkout:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <aside>
    <div>
      <div class="brand">
        <div class="brand-dot"></div>
        OshPOS Pro
      </div>
      <nav class="nav-links">
        <a href="/" class="nav-item">Меню кассы</a>
        <a href="/cart.html" class="nav-item active">Корзина</a>
        <a href="/dashboard.html" class="nav-item">Дашборд</a>
      </nav>
    </div>
    <div style="font-size: 12px; color: var(--text-muted);">v2.4 • PostgreSQL</div>
  </aside>

  <main class="animate-fade">
    <header>
      <div class="header-title">
        <h1>Ваш Заказ</h1>
        <p>Проверка выбранных позиций перед транзакцией</p>
      </div>
    </header>

    <div class="cart-card">
      <div id="cart-list">
        <div style="color: var(--text-muted);">Загрузка корзины...</div>
      </div>

      <div class="total-box">
        <span class="total-label">Итого к оплате:</span>
        <span class="total-amount" id="total-amount">0 сум</span>
      </div>

      <button class="btn-checkout" onclick="checkout()">Оформить заказ (PostgreSQL Transaction)</button>
    </div>
  </main>

  <script>
    function renderCart() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const container = document.getElementById('cart-list');
      const totalEl = document.getElementById('total-amount');

      if (cart.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 24px;">Корзина пуста</div>';
        totalEl.textContent = '0 сум';
        return;
      }

      let total = 0;
      container.innerHTML = cart.map(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        return `
          <div class="cart-item">
            <div>
              <div class="item-title">${item.name}</div>
              <div class="item-sub">${Number(item.price).toLocaleString('ru-RU')} сум × ${item.quantity}</div>
            </div>
            <div class="item-price">${Number(itemTotal).toLocaleString('ru-RU')} сум</div>
          </div>
        `;
      }).join('');

      totalEl.textContent = Number(total).toLocaleString('ru-RU') + ' сум';
    }

    async function checkout() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      if (cart.length === 0) return alert('Корзина пуста!');

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: cart, customer_id: 1 })
        });
        const data = await res.json();

        if (data.success) {
          alert(`🎉 Заказ №${data.order_id} создан успешно! Итоговая сумма: ${Number(data.total_amount).toLocaleString('ru-RU')} сум.`);
          localStorage.removeItem('cart');
          renderCart();
        } else {
          alert('❌ Ошибка транзакции: ' + data.error);
        }
      } catch (err) {
        console.error('Ошибка заказа:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
