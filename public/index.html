<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OshPOS — Терминал Меню</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --accent-black: #0f172a;
      --accent-green: #10b981;
      --radius-lg: 16px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-hover: 0 12px 24px -6px rgba(15, 23, 42, 0.08);
      --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    aside {
      width: 260px;
      background-color: var(--accent-black);
      color: #ffffff;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent-green);
    }

    .nav-links {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      transition: var(--transition-smooth);
    }

    .nav-item.active, .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .nav-item:active { transform: scale(0.97); }

    main {
      flex: 1;
      padding: 40px 48px;
      overflow-y: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-title h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-title p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .search-bar {
      margin-bottom: 28px;
      display: flex;
      gap: 12px;
    }

    .search-input {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 14px 20px;
      border-radius: var(--radius-md);
      font-size: 14px;
      outline: none;
      transition: var(--transition-smooth);
      box-shadow: var(--shadow-sm);
    }

    .search-input:focus {
      border-color: var(--accent-black);
      box-shadow: var(--shadow-hover);
    }

    .dishes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
    }

    .dish-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition-smooth);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }

    .dish-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: #cbd5e1;
    }

    .dish-card:active {
      transform: scale(0.96);
    }

    .dish-img-wrapper {
      width: 100%;
      height: 160px;
      overflow: hidden;
      background: #f1f5f9;
    }

    .dish-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dish-card:hover .dish-img { transform: scale(1.06); }

    .dish-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .dish-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .dish-stock {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .dish-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dish-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .btn-add {
      background: var(--accent-black);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .btn-add:hover { background: #1e293b; }
    .btn-add:active { transform: scale(0.92); }
  </style>
</head>
<body>

  <aside>
    <div>
      <div class="brand">
        <div class="brand-dot"></div>
        OshPOS Pro
      </div>
      <nav class="nav-links">
        <a href="/" class="nav-item active">Меню кассы</a>
        <a href="/cart.html" class="nav-item">Корзина</a>
        <a href="/dashboard.html" class="nav-item">Дашборд</a>
      </nav>
    </div>
    <div style="font-size: 12px; color: var(--text-muted);">v2.4 • PostgreSQL</div>
  </aside>

  <main class="animate-fade">
    <header>
      <div class="header-title">
        <h1>Каталог Меню</h1>
        <p>Выбор позиций для оформления заказа</p>
      </div>
    </header>

    <div class="search-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Поиск блюд по названию (например, Plov)..." oninput="fetchDishes()">
    </div>

    <div class="dishes-grid" id="dishes-container">
      <div style="color: var(--text-muted);">Загрузка меню...</div>
    </div>
  </main>

  <script>
    async function fetchDishes() {
      const search = document.getElementById('search-input').value;
      try {
        const res = await fetch(`/api/dishes?search=${encodeURIComponent(search)}`);
        const data = await res.json();
        const container = document.getElementById('dishes-container');

        if (data.success && data.data.length > 0) {
          container.innerHTML = data.data.map(dish => `
            <div class="dish-card" onclick="window.location.href='/product.html?id=${dish.dish_id}'">
              <div class="dish-img-wrapper">
                <img src="${dish.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600'}" class="dish-img" alt="${dish.name}">
              </div>
              <div class="dish-body">
                <div>
                  <div class="dish-name">${dish.name}</div>
                  <div class="dish-stock">В наличии: ${dish.stock_quantity || 0} шт.</div>
                </div>
                <div class="dish-footer">
                  <span class="dish-price">${Number(dish.price).toLocaleString('ru-RU')} сум</span>
                  <button class="btn-add" onclick="event.stopPropagation(); addToCart(${dish.dish_id}, '${dish.name}', ${dish.price})">+ В корзину</button>
                </div>
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<div style="color: var(--text-muted); grid-column: 1/-1;">Ничего не найдено</div>';
        }
      } catch (err) {
        console.error('Ошибка загрузки блюд:', err);
      }
    }

    function addToCart(id, name, price) {
      let cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const existing = cart.find(item => item.dish_id === id);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ dish_id: id, name, price, quantity: 1 });
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      alert(`«${name}» добавлено в корзину!`);
    }

    document.addEventListener('DOMContentLoaded', fetchDishes);
  </script>
</body>
</html>
